{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create your account</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Name <input name="name" required maxlength="60" autocomplete="name"></label>
    <label>Email <input name="email" type="email" required maxlength="120" autocomplete="email"></label>
    <label>Password (8+ characters) <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
    <button type="submit">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
